<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  D-Bus system bus policy for dynamisd. Installed to /etc/dbus-1/system.d/.

  Only root may own the power-profiles names. Anyone may call them: whether a
  call is allowed to change anything is decided by polkit inside the daemon
  (see net.dynamis.power.policy).
-->
<busconfig>
  <policy user="root">
    <allow own="org.freedesktop.UPower.PowerProfiles"/>
    <allow own="net.hadess.PowerProfiles"/>
  </policy>

  <policy context="default">
    <allow send_destination="org.freedesktop.UPower.PowerProfiles"/>
    <allow send_destination="net.hadess.PowerProfiles"/>
  </policy>
</busconfig>
