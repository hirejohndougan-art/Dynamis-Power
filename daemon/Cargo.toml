[workspace]
resolver = "2"
members = ["crates/dynamis-core", "crates/dynamis-cli", "crates/dynamisd", "crates/dynamis-sync", "crates/dynamis-quirktool", "crates/dynamis-agent"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/hirejohndougan-art/dynamis-power"
rust-version = "1.89"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
