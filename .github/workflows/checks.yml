name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  schema:
    name: Validate result schemas and examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install check-jsonschema
      - name: Schema is valid JSON Schema
        run: check-jsonschema --check-metaschema schema/v1/results.schema.json
      - name: Examples match the schema
        run: check-jsonschema --schemafile schema/v1/results.schema.json schema/v1/examples/*.json

  rust:
    name: Rust format, lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon
      - name: Install D-Bus and shellcheck for the service tests
        run: sudo apt-get update && sudo apt-get install -y dbus shellcheck
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: CLI runs against the fixture
        run: cargo run -q -- --root ../tests/fixtures/sysfs/synthetic-laptop inventory
      - name: Install scripts pass shellcheck
        run: shellcheck dist/install.sh dist/uninstall.sh scripts/phase1-test.sh packaging/build-deb.sh packaging/debian/postinst packaging/debian/prerm packaging/debian/postrm
      - name: Build the service package
        run: ./packaging/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dynamis-power-service-deb
          path: daemon/target/deb/*.deb
      - name: CLI changes and restores a copy of the fixture
        run: |
          cp -a ../tests/fixtures/sysfs/synthetic-laptop "$RUNNER_TEMP/fx"
          D="cargo run -q -- --root $RUNNER_TEMP/fx --state-dir $RUNNER_TEMP/state"
          $D settings
          $D set vm.swappiness 10
          echo n | $D set cpu.turbo off --trial 2
          $D restore
          $D journal
          test "$(cat $RUNNER_TEMP/fx/proc/sys/vm/swappiness)" = 60
          test "$(cat $RUNNER_TEMP/fx/sys/devices/system/cpu/intel_pstate/no_turbo)" = 0

  app:
    name: App tests and Linux package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri
      - name: Install WebKitGTK
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - name: Build the .deb
        run: npx tauri build --bundles deb
      - uses: actions/upload-artifact@v4
        with:
          name: dynamis-power-app-deb
          path: gui/src-tauri/target/release/bundle/deb/*.deb

  docs:
    name: Check documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check relative links point to real files
        run: |
          python3 - <<'PY'
          import re, pathlib, sys
          bad = []
          for md in pathlib.Path('.').rglob('*.md'):
              if any(p in md.parts for p in ('node_modules', 'target', '.git')):
                  continue
              for link in re.findall(r'\]\(([^)#\s]+)(?:#[^)]*)?\)', md.read_text()):
                  if link.startswith(('http://', 'https://', 'mailto:')) or '?' in link:
                      continue
                  if not (md.parent / link).resolve().exists():
                      bad.append(f'{md}: {link}')
          print('\n'.join(bad) or 'All relative links resolve.')
          sys.exit(1 if bad else 0)
          PY
