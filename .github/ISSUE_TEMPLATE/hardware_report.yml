name: Hardware report
description: Tell us about your machine so we can support it.
labels: [hardware]
body:
  - type: markdown
    attributes:
      value: |
        This helps us learn what laptops expose. Please remove serial numbers before pasting.
        Until the app exists, these commands collect the useful details:
        ```
        cat /sys/class/dmi/id/sys_vendor /sys/class/dmi/id/product_name
        lscpu | head -20
        ls /sys/class/power_supply/*/ /sys/class/powercap/ 2>/dev/null
        cat /sys/devices/system/cpu/cpufreq/policy0/scaling_driver
        cat /sys/firmware/acpi/platform_profile_choices 2>/dev/null
        lsblk -d -o NAME,SIZE,ROTA,MODEL
        ```
  - type: input
    id: laptop
    attributes:
      label: Laptop vendor and model
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distribution, desktop and kernel
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Command output
      render: text
